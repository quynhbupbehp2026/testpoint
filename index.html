<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tra Cứu TestPoint</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #121316; color: #fff; min-height: 100vh; padding: 24px 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 600px; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 24px; color: #6366f1; margin-bottom: 6px; }
    .search-box { position: relative; margin-bottom: 20px; }
    .search-input { width: 100%; height: 48px; background: #1a1b20; border: 1px solid #2d2f36; border-radius: 12px; padding: 0 44px 0 16px; color: #fff; font-size: 15px; outline: none; }
    .search-input:focus { border-color: #6366f1; }
    .search-icon { position: absolute; right: 16px; top: 15px; color: #6b7280; font-size: 16px; }
    .result-list { display: flex; flex-direction: column; gap: 12px; }
    .card { background: #1a1b20; border: 1px solid #2d2f36; border-radius: 12px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; }
    .card:hover { border-color: #6366f1; background: #202229; }
    .card-info h3 { font-size: 15px; text-transform: uppercase; margin-bottom: 4px; }
    .card-info span { font-size: 12.5px; color: #8e8f96; background: #262832; padding: 2px 8px; border-radius: 6px; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; padding: 16px; }
    .modal-content { background: #1a1b20; border-radius: 14px; max-width: 90%; max-height: 90%; overflow: hidden; display: flex; flex-direction: column; border: 1px solid #333; }
    .modal-header { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d2f36; }
    .modal-body { padding: 12px; overflow-y: auto; text-align: center; }
    .modal-body img { max-width: 100%; max-height: 70vh; object-fit: contain; border-radius: 8px; }
    .close-btn { background: none; border: none; color: #aaa; font-size: 20px; cursor: pointer; }
    .empty-state { text-align: center; color: #6b7280; padding: 40px 0; font-size: 14px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🔍 Tra Cứu TestPoint</h1>
      <p style="font-size: 13px; color: #8e8f96;">Nhập mã model hoặc tên thiết bị cần tìm</p>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="Ví dụ: a12, edl, a125f..." autofocus />
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
    </div>

    <div id="resultList" class="result-list"></div>
    <div id="emptyMsg" class="empty-state" style="display: none;">Không tìm thấy model phù hợp</div>
  </div>

  <div id="imageModal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h4 id="modalTitle" style="font-size: 15px;"></h4>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <img id="modalImg" src="" alt="Testpoint" />
      </div>
    </div>
  </div>

  <script>
    let testpoints = [];

    fetch('data.json')
      .then(res => res.json())
      .then(data => {
        testpoints = data;
        renderList(testpoints);
      })
      .catch(err => {
        document.getElementById('resultList').innerHTML = 
          `<p style="color:#ef4444;text-align:center;">Lỗi tải dữ liệu data.json</p>`;
      });

    const searchInput = document.getElementById('searchInput');
    const resultList = document.getElementById('resultList');
    const emptyMsg = document.getElementById('emptyMsg');

    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      const filtered = testpoints.filter(item => 
        item.keyword.toLowerCase().includes(q) || item.title.toLowerCase().includes(q)
      );
      renderList(filtered);
    });

    function renderList(list) {
      resultList.innerHTML = '';
      if (list.length === 0) {
        emptyMsg.style.display = 'block';
        return;
      }
      emptyMsg.style.display = 'none';

      list.forEach(item => {
        const div = document.createElement('div');
        div.className = 'card';
        div.onclick = () => openModal(item.title, item.image);
        div.innerHTML = `
          <div class="card-info">
            <h3>${item.title}</h3>
            <span>Từ khóa: ${item.keyword}</span>
          </div>
          <i class="fa-solid fa-chevron-right" style="color: #6366f1;"></i>
        `;
        resultList.appendChild(div);
      });
    }

    function openModal(title, imgSrc) {
      document.getElementById('modalTitle').textContent = title.toUpperCase();
      document.getElementById('modalImg').src = imgSrc;
      document.getElementById('imageModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('imageModal').style.display = 'none';
    }
  </script>
</body>
</html>
