<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tra Cứu TestPoint</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #121316; color: #fff; min-height: 100vh; padding: 24px 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 600px; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 24px; color: #6366f1; margin-bottom: 6px; }
    .search-box { position: relative; margin-bottom: 20px; }
    .search-input { width: 100%; height: 48px; background: #1a1b20; border: 1px solid #2d2f36; border-radius: 12px; padding: 0 76px 0 16px; color: #fff; font-size: 15px; outline: none; }
    .search-input:focus { border-color: #6366f1; }
    .search-icon { position: absolute; right: 16px; top: 15px; color: #6b7280; font-size: 16px; pointer-events: none; }
    .clear-icon { position: absolute; right: 44px; top: 15px; color: #6b7280; font-size: 18px; cursor: pointer; display: none; }
    .clear-icon:hover { color: #fff; }
    .result-list { display: flex; flex-direction: column; gap: 12px; }
    .card { background: #1a1b20; border: 1px solid #2d2f36; border-radius: 12px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; }
    .card:hover { border-color: #6366f1; background: #202229; }
    .card-info h3 { font-size: 15px; text-transform: uppercase; margin-bottom: 4px; }
    .card-info span { font-size: 12.5px; color: #8e8f96; background: #262832; padding: 2px 8px; border-radius: 6px; }
    
    /* CSS cho Modal và Nút Hành Động */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.88); z-index: 100; justify-content: center; align-items: center; padding: 12px; }
    .modal-content { background: #1a1b20; border-radius: 14px; max-width: 96%; max-height: 94%; overflow: hidden; display: flex; flex-direction: column; border: 1px solid #333; position: relative; }
    .modal-header { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d2f36; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .copy-btn { background: #262832; border: 1px solid #3b3d46; color: #818cf8; font-size: 14px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 8px; font-weight: 500; }
    .copy-btn:hover { background: #30323d; border-color: #6366f1; color: #a5b4fc; }
    .close-btn { background: none; border: none; color: #aaa; font-size: 20px; cursor: pointer; transition: 0.2s; }
    .close-btn:hover { color: #fff; }
    
    .modal-body { padding: 12px; overflow: auto; text-align: center; }
    .modal-body img { max-width: 100%; max-height: 82vh; object-fit: contain; border-radius: 8px; transition: transform .15s ease; cursor: zoom-in; }
    .zoom-label { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.7); color: #a5b4fc; font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 999px; pointer-events: none; }
    .zoom-btn { background: #262832; border: 1px solid #3b3d46; color: #818cf8; font-size: 16px; cursor: pointer; transition: 0.2s; width: 30px; height: 30px; border-radius: 8px; font-weight: 700; line-height: 1; }
    .zoom-btn:hover { background: #30323d; border-color: #6366f1; color: #a5b4fc; }
    .empty-state { text-align: center; color: #6b7280; padding: 40px 0; font-size: 14px; }

    /* ===== TOAST ===== */
    #toast {
      position: fixed; bottom: 30px; left: 50%;
      transform: translateX(-50%) translateY(24px) scale(.9);
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff; padding: 12px 24px; border-radius: 999px;
      font-size: 14px; font-weight: 600;
      display: flex; align-items: center; gap: 8px;
      opacity: 0; pointer-events: none;
      transition: all .3s cubic-bezier(.22, 1, .36, 1);
      z-index: 200;
      box-shadow: 0 10px 30px -6px rgba(99, 102, 241, .5);
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0) scale(1);
    }
    #toast .t-icon {
      width: 20px; height: 20px; border-radius: 50%;
      background: rgba(255,255,255,.25);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 11px;
      animation: tPop .4s cubic-bezier(.34, 1.56, .64, 1);
    }
    @keyframes tPop {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🔍 Tra Cứu TestPoint</h1>
      <p style="font-size: 13px; color: #8e8f96;">Nhập mã model hoặc tên thiết bị cần tìm</p>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="Ví dụ: a12, edl, a125f..." autofocus />
      <i id="clearSearch" class="fa-solid fa-xmark clear-icon" title="Xóa"></i>
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
    </div>

    <div id="resultList" class="result-list"></div>
    <div id="emptyMsg" class="empty-state" style="display: none;">Không tìm thấy model phù hợp</div>
  </div>

  <div id="imageModal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h4 id="modalTitle" style="font-size: 15px;"></h4>
        <div class="header-actions">
          <button class="zoom-btn" onclick="zoomOut()" title="Thu nhỏ">−</button>
          <button class="zoom-btn" onclick="zoomReset()" title="Đặt lại">⟳</button>
          <button class="zoom-btn" onclick="zoomIn()" title="Phóng to">+</button>
          <button class="copy-btn" onclick="rotateImage()" title="Xoay ảnh 90 độ">
            <i class="fa-solid fa-rotate-right"></i> <span>Xoay ảnh</span>
          </button>
          <button class="copy-btn" onclick="copyImage()" title="Sao chép ảnh vào clipboard">
            <i id="copyIcon" class="fa-regular fa-copy"></i> <span id="copyText">Sao chép</span>
          </button>
          <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>
      </div>
      <div class="modal-body" id="modalBody">
        <img id="modalImg" src="" alt="Testpoint" />
      </div>
      <div class="zoom-label" id="zoomLabel">100%</div>
    </div>
  </div>

  <script>
    let testpoints = [];

    let manualData = [];   // entry từ data.json
    let autoData = [];     // entry tự sinh từ tên file ảnh trong images/
    const GH_LIST_CACHE_KEY = 'gh_images_cache';
    const GH_LIST_CACHE_TTL = 5 * 60 * 1000; // cache 5 phút

    // Chuẩn hóa: bỏ dấu tiếng Việt + thường + trim
    function normalizeText(str) {
      return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/đ/g, 'd').replace(/Đ/g, 'D')
        .toLowerCase().trim();
    }

    function fetchManualData() {
      return fetch('data.json?v=' + Date.now())
        .then(res => res.json())
        .then(data => { manualData = data; })
        .catch(() => { manualData = []; });
    }

    // Tự động quét thư mục images/ qua GitHub API
    function fetchAutoData() {
      try {
        const cached = JSON.parse(localStorage.getItem(GH_LIST_CACHE_KEY) || 'null');
        if (cached && (Date.now() - cached.t) < GH_LIST_CACHE_TTL) {
          autoData = cached.items;
          return Promise.resolve();
        }
      } catch(e) {}

      const cfg = { owner: 'quynhbupbehp2026', repo: 'testpoint', branch: 'main' };
      try {
        const over = JSON.parse(localStorage.getItem('gh_repo_cfg') || 'null');
        if (over && over.owner) Object.assign(cfg, over);
      } catch(e) {}

      const IMG_EXTS = ['png','jpg','jpeg','webp','gif','bmp','svg','ico'];
      const items = [];

      function scanDir(dirPath) {
        const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${dirPath}?ref=${cfg.branch}`;
        return fetch(url).then(res => res.json()).then(list => {
          if (!Array.isArray(list)) return;
          const subDirs = [];
          list.forEach(f => {
            if (f.type === 'dir') {
              subDirs.push(f);
              return;
            }
            const m = f.name.match(/^(.*)\.([a-zA-Z0-9]+)$/);
            if (!m) return;
            const ext = m[2].toLowerCase();
            if (!IMG_EXTS.includes(ext)) return;
            const display = decodeURIComponent(m[1]).trim();
            if (!display || display.toLowerCase() === 'filename') return;
            items.push({
              id: 'auto_' + display.replace(/\s+/g, '_'),
              title: display,
              keyword: normalizeText(display) + ' ' + normalizeText(display).replace(/\s+/g, ''),
              image: dirPath + '/' + f.name,
              folder: dirPath.replace('images/', '').replace('images', '')
            });
          });
          return Promise.all(subDirs.map(d => scanDir(dirPath + '/' + d.name)));
        }).catch(() => {});
      }

      return scanDir('images').then(() => {
        autoData = items;
        localStorage.setItem(GH_LIST_CACHE_KEY, JSON.stringify({ t: Date.now(), items }));
      });
    }

    function refreshTestpoints() {
      const seen = new Set(manualData.map(x => normalizeText(x.title)));
      testpoints = [...manualData, ...autoData.filter(x => !seen.has(normalizeText(x.title)))];
    }

    Promise.all([fetchManualData(), fetchAutoData()])
      .then(() => { refreshTestpoints(); })
      .catch(() => {
        document.getElementById('resultList').innerHTML = 
          `<p style="color:#ef4444;text-align:center;">Lỗi tải dữ liệu</p>`;
      });

    const searchInput = document.getElementById('searchInput');
    const resultList = document.getElementById('resultList');
    const emptyMsg = document.getElementById('emptyMsg');
    const clearBtn = document.getElementById('clearSearch');

    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      
      if (q === '') {
        clearBtn.style.display = 'none';
        resultList.innerHTML = '';
        emptyMsg.style.display = 'none';
        return;
      }

      clearBtn.style.display = 'block';

      const filtered = testpoints.filter(item => 
        (item.keyword || '').toLowerCase().includes(q) ||
        item.title.toLowerCase().includes(q) ||
        normalizeText(item.title).includes(q)
      );
      renderList(filtered);
    });

    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchInput.dispatchEvent(new Event('input'));
      searchInput.focus();
    });

    function renderList(list) {
      resultList.innerHTML = '';
      if (list.length === 0) {
        emptyMsg.style.display = 'block';
        return;
      }
      emptyMsg.style.display = 'none';

      list.forEach(item => {
        const div = document.createElement('div');
        div.className = 'card';
        div.onclick = () => openModal(item.title, item.image);
        div.innerHTML = `
          <div class="card-info">
            <h3>${item.title}</h3>
            <span>${item.keyword ? 'Từ khóa: ' + item.keyword : 'TestPoint'}</span>
          </div>
          <i class="fa-solid fa-chevron-right" style="color: #6366f1;"></i>
        `;
        resultList.appendChild(div);
      });
    }

    const IMG_FALLBACK_EXTS = ['png', 'jpg', 'jpeg', 'webp', 'gif', 'bmp', 'svg', 'ico'];
    let currentImageSrc = '';
    let fallbackList = [];
    let fallbackIdx = 0;

    function tryLoadImage(src, onOk, onFail) {
      const probe = new Image();
      probe.onload = () => onOk(src);
      probe.onerror = onFail;
      probe.src = src;
    }

    function buildFallbackList(src) {
      const m = src.match(/^(.*\.)([a-zA-Z0-9]+)$/);
      if (!m) return [src];
      const dir = m[1];
      const baseName = m[1].replace(/^.*\//, '');
      const dirPart = m[1].slice(0, m[1].length - baseName.length);
      const curExt = m[2].toLowerCase();
      const caseVariants = [...new Set([
        baseName,
        baseName.toLowerCase(),
        baseName.toUpperCase(),
        baseName.toLowerCase().replace(/(^|[\s%20_-])([a-z])/g, (x, p, c) => p + c.toUpperCase())
      ])];
      const list = [];
      for (const cv of caseVariants) {
        for (const e of [curExt, ...IMG_FALLBACK_EXTS.filter(x => x !== curExt)]) {
          const cand = dirPart + cv + e;
          if (!list.includes(cand)) list.push(cand);
        }
      }
      return list.length ? list : [src];
    }

    function openModal(title, imgSrc) {
      document.getElementById('modalTitle').textContent = title.toUpperCase();
      document.getElementById('copyIcon').className = 'fa-regular fa-copy';
      document.getElementById('copyText').textContent = 'Sao chép';
      document.getElementById('imageModal').style.display = 'flex';
      currentImageSrc = imgSrc;
      fallbackList = buildFallbackList(imgSrc);
      fallbackIdx = 0;
      tryLoadImage(fallbackList[0],
        (ok) => { document.getElementById('modalImg').src = ok; resetZoom(); },
        () => {
          fallbackIdx++;
          if (fallbackIdx < fallbackList.length) {
            tryLoadImage(fallbackList[fallbackIdx],
              (ok) => { document.getElementById('modalImg').src = ok; currentImageSrc = ok; resetZoom(); showToast('⚠ File gốc không có — đã thay bằng .' + ok.split('.').pop().toUpperCase(), 'i'); },
              () => openModalNextFallback(title)
            );
          } else {
            document.getElementById('modalImg').removeAttribute('src');
            showToast('✖ Không tìm thấy ảnh với mọi định dạng', '!');
          }
        });
    }

    function openModalNextFallback(title) {
      fallbackIdx++;
      if (fallbackIdx < fallbackList.length) {
        tryLoadImage(fallbackList[fallbackIdx],
          (ok) => { document.getElementById('modalImg').src = ok; currentImageSrc = ok; resetZoom(); },
          () => openModalNextFallback(title));
      } else {
        document.getElementById('modalImg').removeAttribute('src');
        showToast('✖ Không tìm thấy ảnh với mọi định dạng', '!');
      }
    }

    function closeModal() {
      document.getElementById('imageModal').style.display = 'none';
    }

    const ZOOM_MIN = 0.2, ZOOM_MAX = 6, ZOOM_STEP = 1.25;
    let zoomLevel = 1;
    let rotationAngle = 0;

    function applyZoom() {
      const img = document.getElementById('modalImg');
      img.style.transform = `scale(${zoomLevel}) rotate(${rotationAngle}deg)`;
      img.style.cursor = zoomLevel > 1 ? 'grab' : 'zoom-in';
      document.getElementById('zoomLabel').textContent = Math.round(zoomLevel * 100) + '%';
      const body = document.getElementById('modalBody');
      if (zoomLevel > 1) {
        img.style.maxWidth = 'none';
        img.style.maxHeight = 'none';
        img.style.width = img.naturalWidth + 'px';
        img.style.height = img.naturalHeight + 'px';
        body.style.overflow = 'auto';
      } else {
        img.style.maxWidth = '100%';
        img.style.maxHeight = '82vh';
        img.style.width = 'auto';
        img.style.height = 'auto';
        body.style.overflow = 'auto';
        body.scrollLeft = 0; body.scrollTop = 0;
      }
    }
    function zoomIn()  { zoomLevel = Math.min(zoomLevel * ZOOM_STEP, ZOOM_MAX); applyZoom(); }
    function zoomOut() { zoomLevel = Math.max(zoomLevel / ZOOM_STEP, ZOOM_MIN); applyZoom(); }
    function zoomReset() { zoomLevel = 1; rotationAngle = 0; applyZoom(); }
    function rotateImage() { rotationAngle = (rotationAngle + 90) % 360; applyZoom(); }

    document.getElementById('modalBody').addEventListener('wheel', (e) => {
      e.preventDefault();
      if (e.deltaY < 0) zoomIn(); else zoomOut();
    }, { passive: false });

    document.getElementById('modalImg').addEventListener('click', () => {
      if (zoomLevel === 1) zoomIn();
    });

    const _origOpenModal = openModal;
    openModal = function(title, imgSrc) {
      zoomLevel = 1;
      rotationAngle = 0;
      const img = document.getElementById('modalImg');
      img.style.transform = 'scale(1) rotate(0deg)';
      img.style.maxWidth = '100%'; img.style.maxHeight = '82vh';
      img.style.width = 'auto'; img.style.height = 'auto';
      document.getElementById('zoomLabel').textContent = '100%';
      _origOpenModal(title, imgSrc);
    };

    let toastTimer = null;
    function showToast(msg, icon = '✓') {
      const t = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      document.getElementById('toastIcon').textContent = icon;
      const ic = document.getElementById('toastIcon');
      ic.style.animation = 'none';
      void ic.offsetWidth;
      ic.style.animation = '';
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
    }

    // ===== LỆNH SAO CHÉP TỐI ƯU CHO SAFARI IPHONE & PC =====
    async function copyImage() {
      const imgEl = document.getElementById('modalImg');
      const imgSrc = imgEl.src;
      const copyIcon = document.getElementById('copyIcon');
      const copyText = document.getElementById('copyText');

      const resetBtn = () => setTimeout(() => {
        copyIcon.className = 'fa-regular fa-copy';
        copyText.textContent = 'Sao chép';
      }, 2000);

      const ok = () => {
        copyIcon.className = 'fa-solid fa-check';
        copyText.textContent = 'Đã chép';
        resetBtn();
        showToast('Đã sao chép ảnh vào clipboard');
      };

      // 1. Tối ưu cho Safari iOS: Khởi tạo ClipboardItem trực tiếp với Promise<Blob>
      if (navigator.clipboard && window.ClipboardItem) {
        try {
          const item = new ClipboardItem({
            'image/png': new Promise((resolve, reject) => {
              const canvas = document.createElement('canvas');
              canvas.width = imgEl.naturalWidth || 300;
              canvas.height = imgEl.naturalHeight || 300;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(imgEl, 0, 0);
              canvas.toBlob(blob => {
                if (blob) resolve(blob);
                else reject(new Error('Canvas conversion failed'));
              }, 'image/png');
            })
          });

          await navigator.clipboard.write([item]);
          ok();
          return;
        } catch (e1) {
          console.warn('Cánh 1 (Promise ClipboardItem) không thành công, chuyển sang fetch...', e1);
        }
      }

      // 2. Phương án 2: Fetch Blob trực tiếp
      try {
        const response = await fetch(imgSrc);
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const blob = await response.blob();
        const type = (blob.type && blob.type.startsWith('image/')) ? blob.type : 'image/png';
        await navigator.clipboard.write([new ClipboardItem({ [type]: blob })]);
        ok();
        return;
      } catch (e2) {
        console.warn('Cánh 2 (Fetch Blob) thất bại...', e2);
      }

      // 3. Dự phòng cuối cùng: Mở ảnh tab mới nếu Safari chặn hoàn toàn
      window.open(imgSrc, '_blank');
      copyText.textContent = 'Đã mở ảnh';
      resetBtn();
      showToast('Trình duyệt chặn clipboard — đã mở ảnh tab mới', 'ℹ');
    }
  </script>
  <div id="toast"><span class="t-icon" id="toastIcon">✓</span><span id="toastMsg"></span></div>
</body>
</html>
