<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quản Lý Testpoint</title>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #333333;
      --primary-color: #007bff;
      --border-color: #e0e0e0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    .header h2 {
      margin: 0;
      font-size: 1.4rem;
    }

    .toggle-btn {
      background: none;
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .toggle-btn:hover {
      background-color: #f0f0f0;
    }

    /* Style cho khu vực ảnh chụp / mục dữ liệu */
    .captured-section {
      transition: all 0.3s ease;
    }

    .captured-section.hidden {
      display: none;
    }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      margin-top: 15px;
    }

    .image-card {
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
      text-align: center;
    }

    .image-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      display: block;
    }

    .image-card .title {
      padding: 8px;
      font-size: 0.85rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>Mục Tôi Đã Chụp</h2>
      <!-- Nút Ẩn / Hiện -->
      <button id="toggleCapturedBtn" class="toggle-btn" onclick="toggleCapturedItems()">
        <span id="toggleIcon">👁️</span>
        <span id="toggleText">Ẩn mục</span>
      </button>
    </div>

    <!-- Khu vực danh sách mục / ảnh chụp -->
    <div id="capturedSection" class="captured-section">
      <div class="image-grid">
        <!-- Ví dụ hiển thị mục ảnh đã chụp -->
        <div class="image-card">
          <img src="image_1c9904.png" alt="Ảnh chụp 1" onerror="this.src='https://via.placeholder.com/180x140?text=No+Image'" />
          <div class="title">Testpoint 1</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Hàm thực thi Ẩn / Hiện mục đã chụp
    function toggleCapturedItems() {
      const section = document.getElementById('capturedSection');
      const icon = document.getElementById('toggleIcon');
      const text = document.getElementById('toggleText');

      const isHidden = section.classList.toggle('hidden');

      // Cập nhật giao diện nút
      if (isHidden) {
        icon.textContent = '🙈';
        text.textContent = 'Hiện mục';
        localStorage.setItem('capturedItemsHidden', 'true');
      } else {
        icon.textContent = '👁️';
        text.textContent = 'Ẩn mục';
        localStorage.setItem('capturedItemsHidden', 'false');
      }
    }

    // Khôi phục trạng thái ẩn/hiện khi tải lại trang
    document.addEventListener('DOMContentLoaded', () => {
      const isHidden = localStorage.getItem('capturedItemsHidden') === 'true';
      if (isHidden) {
        document.getElementById('capturedSection').classList.add('hidden');
        document.getElementById('toggleIcon').textContent = '🙈';
        document.getElementById('toggleText').textContent = 'Hiện mục';
      }
    });
  </script>
</body>
</html>
