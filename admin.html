<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Quản Trị - Test Point</title>
    <style>
        :root {
            --primary-color: #0969da;
            --bg-color: #f6f8fa;
            --border-color: #d0d7de;
            --text-color: #24292f;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            padding: 24px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }

        h1, h2 {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .actions-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            background-color: #f6f8fa;
            color: var(--text-color);
            transition: 0.2s;
        }

        .btn:hover {
            background-color: #f3f4f6;
        }

        .btn-primary {
            background-color: #1f883d;
            color: white;
            border-color: rgba(27,31,36,0.15);
        }

        .btn-primary:hover {
            background-color: #1a7f37;
        }

        .btn-secondary {
            background-color: #0969da;
            color: white;
            border-color: rgba(27,31,36,0.15);
        }

        .btn-secondary:hover {
            background-color: #0860ca;
        }

        .question-item {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 12px;
            background-color: #fff;
        }

        #fileInput {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Bảng Quản Trị Câu Hỏi</h1>

    <!-- Thanh công cụ có thêm 2 nút mới -->
    <div class="actions-bar">
        <button class="btn btn-primary" onclick="addNewQuestion()">+ Thêm câu hỏi mới</button>
        
        <!-- 2 Nút chức năng mới bổ sung -->
        <button class="btn btn-secondary" onclick="exportData()">📥 Xuất dữ liệu (JSON)</button>
        <button class="btn btn-secondary" onclick="triggerImport()">📤 Nhập dữ liệu (JSON)</button>
        <input type="file" id="fileInput" accept=".json" onchange="importData(event)">
    </div>

    <h2>Danh sách câu hỏi hiện có</h2>
    <div id="questionList">
        <!-- Danh sách câu hỏi hiển thị tại đây -->
    </div>
</div>

<script>
    // Dữ liệu mẫu ban đầu
    let questions = [
        {
            id: 1,
            title: "Câu hỏi 1: Thủ đô của Việt Nam là gì?",
            options: ["A. Hà Nội", "B. TP. Hồ Chí Minh", "C. Đà Nẵng", "D. Hải Phòng"],
            answer: 0
        }
    ];

    function renderQuestions() {
        const container = document.getElementById("questionList");
        container.innerHTML = "";

        if (questions.length === 0) {
            container.innerHTML = "<p>Chưa có câu hỏi nào.</p>";
            return;
        }

        questions.forEach((q, index) => {
            const div = document.createElement("div");
            div.className = "question-item";
            div.innerHTML = `
                <strong>${index + 1}. ${q.title}</strong>
                <ul>
                    ${q.options.map(opt => `<li>${opt}</li>`).join("")}
                </ul>
            `;
            container.appendChild(div);
        });
    }

    function addNewQuestion() {
        const title = prompt("Nhập nội dung câu hỏi:");
        if (title) {
            questions.push({
                id: Date.now(),
                title: title,
                options: ["Đáp án A", "Đáp án B", "Đáp án C", "Đáp án D"],
                answer: 0
            });
            renderQuestions();
        }
    }

    // Chức năng 1: Xuất dữ liệu JSON
    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(questions, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "questions_data.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    // Chức năng 2: Nhập dữ liệu JSON
    function triggerImport() {
        document.getElementById('fileInput').click();
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedQuestions = JSON.parse(e.target.result);
                if (Array.isArray(importedQuestions)) {
                    questions = importedQuestions;
                    renderQuestions();
                    alert("Nhập dữ liệu câu hỏi thành công!");
                } else {
                    alert("Định dạng file không hợp lệ!");
                }
            } catch (err) {
                alert("Lỗi khi đọc file JSON!");
            }
        };
        reader.readAsText(file);
    }

    // Khởi chạy ban đầu
    renderQuestions();
</script>

</body>
</html>
